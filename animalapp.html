<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Health Profile</title>

<style>
:root{
    --primary:#4F8EF7;
    --primary-dark:#366dd3;
    --accent:#69D98A;
    --background:#F4F7FB;
    --card:#FFFFFF;
    --text:#23303D;
    --muted:#778394;
    --border:#E5EAF0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

body{
    background:var(--background);
    color:var(--text);
}

.container{
    max-width:460px;
    margin:auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    background:linear-gradient(145deg,var(--primary),#72A7FF);
    color:white;
    padding:30px 24px 70px;
    border-bottom-left-radius:32px;
    border-bottom-right-radius:32px;
    position:relative;
}

.profile{
    position:relative;
    margin-top:-45px;
    padding:0 20px;
}

.card{
    background:white;
    border-radius:24px;
    padding:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.pet-header{
    display:flex;
    gap:18px;
    align-items:center;
    margin-bottom:25px;
}

.avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    background:linear-gradient(145deg,#FFE7B2,#FFC864);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:44px;
}

.pet-info h2{
    font-size:1.6rem;
}

.pet-info p{
    color:var(--muted);
    margin-top:4px;
}

.section-title{
    font-weight:700;
    margin-bottom:16px;
    margin-top:10px;
}

.grid{
    display:grid;
    gap:14px;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    font-size:.82rem;
    color:var(--muted);
    margin-bottom:6px;
}

input,
select{
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    font-size:1rem;
    background:#FAFBFD;
    outline:none;
}

input:focus,
select:focus{
    border-color:var(--primary);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0;
}

.stat{
    background:#F7F9FC;
    border-radius:16px;
    padding:14px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:1.1rem;
    color:var(--primary);
}

.bottom{
    margin-top:auto;
    padding:22px;
    position:sticky;
    bottom:0;
    background:linear-gradient(to top, white 70%, rgba(255,255,255,.7));
}

button{
    width:100%;
    border:none;
    background:linear-gradient(135deg,var(--accent),#47C96B);
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 24px rgba(80,190,120,.35);
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
}

.note{
    text-align:center;
    color:var(--muted);
    font-size:.78rem;
    margin-top:10px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:999px;
    background:#E9F8EE;
    color:#28A85A;
    font-size:.75rem;
    font-weight:600;
    margin-top:8px;
}
</style>

</head>
<body>

<div class="container">

    <div class="header">
        <h1>Pet Health Profile</h1>
        <p>Manage your companion's health and wellbeing.</p>
    </div>

    <div class="profile">

        <div class="card">

            <div class="pet-header">
                <div class="avatar">🐶</div>

                <div class="pet-info">
                    <h2>Charlie</h2>
                    <p>Golden Retriever</p>
                    <div class="badge">Healthy</div>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <strong>4</strong>
                    Years
                </div>

                <div class="stat">
                    <strong>31kg</strong>
                    Weight
                </div>

                <div class="stat">
                    <strong>Good</strong>
                    Condition
                </div>
            </div>

            <div class="section-title">
                Pet Information
            </div>

            <div class="grid">

                <div class="field">
                    <label>Pet Name</label>
                    <input value="Charlie">
                </div>

                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date" value="2022-05-16">
                </div>

                <div class="field">
                    <label>Weight (kg)</label>
                    <input type="number" value="31">
                </div>

                <div class="field">
                    <label>Species</label>
                    <select>
                        <option>Dog</option>
                        <option>Cat</option>
                        <option>Rabbit</option>
                        <option>Bird</option>
                    </select>
                </div>

                <div class="field">
                    <label>Breed</label>
                    <input value="Golden Retriever">
                </div>

                <div class="field">
                    <label>Food Type</label>
                    <select>
                        <option>Dry Food</option>
                        <option>Wet Food</option>
                        <option>Raw Diet</option>
                        <option>Mixed</option>
                    </select>
                </div>

                <div class="field">
                    <label>Daily Food Amount</label>
                    <input value="350 g">
                </div>

                <div class="field">
                    <label>Known Allergies</label>
                    <input placeholder="Chicken, Grain, ...">
                </div>

                <div class="field">
                    <label>Microchip Number</label>
                    <input placeholder="981000123456789">
                </div>

            </div>

        </div>

    </div>

    <div class="bottom">
        <button id="screeningBtn">
            Request Medical Screening
        </button>

        <div class="note">
            AI-assisted health screening by licensed veterinary professionals.
        </div>
    </div>

</div>

<script>
document.getElementById("screeningBtn").addEventListener("click", () => {
    alert("Medical screening requested (demo).");
});
</script>

</body>
</html>
